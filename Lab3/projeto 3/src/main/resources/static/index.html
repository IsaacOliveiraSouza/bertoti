<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoo Manager - Gerenciador de Animais</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.2.1/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🦁</span>
                    <h1>Zoo Manager</h1>
                </div>
                <button class="btn-add" onclick="openModal()">
                    <span class="btn-icon">+</span>
                    Adicionar Animal
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-number" id="total-animals">0</span>
                    <span class="stat-label">Animais Cadastrados</span>
                </div>
            </div>

            <div class="animals-grid" id="animal-list">
                <!-- Animais serão inseridos aqui via JavaScript -->
            </div>

            <div class="empty-state" id="empty-state" style="display: none;">
                <div class="empty-icon">🐾</div>
                <h2>Nenhum animal cadastrado</h2>
                <p>Comece adicionando seu primeiro animal!</p>
            </div>
        </main>
    </div>

    <!-- Modal para adicionar animal -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Adicionar Novo Animal</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="nomeAnimal">Nome do Animal</label>
                    <input 
                        type="text" 
                        id="nomeAnimal" 
                        class="form-input" 
                        placeholder="Ex: Leão, Tigre, Elefante..."
                        autocomplete="off"
                    >
                    <small class="form-hint">Digite o nome do animal que deseja adicionar</small>
                </div>
                <input type="hidden" id="inputID">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn-primary" id="submitBtn">Adicionar Animal</button>
            </div>
        </div>
    </div>

    <!-- Modal de edição -->
    <div class="modal-overlay" id="edit-modal-overlay" onclick="closeEditModalOnOverlay(event)" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Animal</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editNomeAnimal">Nome do Animal</label>
                    <input 
                        type="text" 
                        id="editNomeAnimal" 
                        class="form-input" 
                        placeholder="Novo nome..."
                        autocomplete="off"
                    >
                </div>
                <input type="hidden" id="editAnimalId">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEditModal()">Cancelar</button>
                <button class="btn-primary" id="editSubmitBtn">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
